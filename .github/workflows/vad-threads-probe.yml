name: Speech detection threads probe

# Times speech detection on GitHub's free Mac runners with the published
# engine-macos-v1 CPU engine and with a CPU engine built by Dusty's own recipe
# from the candidate branch, which adds the speech detection threads patch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLIC: dusty-corporation/dusty
      CANDIDATE: candidate-1.1.3
    steps:
      - name: Record the runner
        run: |
          sw_vers
          for key in machdep.cpu.brand_string hw.physicalcpu hw.logicalcpu hw.memsize \
            kern.hv_vmm_present hw.perflevel0.physicalcpu; do
            printf '%s = %s\n' "$key" "$(sysctl -n "$key" 2>/dev/null || echo unavailable)"
          done
          uptime

      - name: Get the candidate recipe and the pinned whisper.cpp source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$CANDIDATE" "https://github.com/$GITHUB_REPOSITORY.git" candidate
          git -C candidate log -1 --format='candidate %H %s'
          commit=$(awk '/^\[whisper_cpp\]$/ { s = 1; next } /^\[/ { s = 0 }
            s && $1 == "commit" { gsub(/"/, "", $3); print $3 }' candidate/native/versions.toml)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git clone -q https://github.com/ggml-org/whisper.cpp.git upstream-whisper
          git -C upstream-whisper checkout -q --detach "$commit"
          test "$(git -C upstream-whisper rev-parse HEAD)" = "$commit"

      - name: Build the patched CPU engine with Dusty's recipe
        run: |
          set -euo pipefail
          mkdir -p work
          start=$(date +%s)
          bash candidate/native/macos/build_whisper.sh upstream-whisper work/whisper-cpu-patched cpu 13.3
          echo "build took $(( $(date +%s) - start )) s"
          grep -E 'approved_patch_sha256|caller_source_state' work/whisper-cpu-patched/provenance.txt
          echo "PATCHED=$PWD/work/whisper-cpu-patched/package/whisper-cli" >> "$GITHUB_ENV"

      - name: Download and verify the published engine and models
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download engine-macos-v1 --repo "$PUBLIC" --dir dl \
            --pattern whisper-cpu-macos-arm64.zip --pattern ffmpeg-macos-arm64.zip
          gh release download models-v1 --repo "$PUBLIC" --dir dl \
            --pattern ggml-tiny.bin --pattern ggml-silero-vad.bin
          cp candidate/tests/fixtures/audio/formats/jfk.wav candidate/tests/fixtures/audio/vad/mostly-silence-10min.m4a dl/
          # Hashes pinned in Dusty's native/versions.toml and resources/models.json.
          printf '%s  %s\n' \
            b384b21d068441e4095d035d4420077585a5e1a177723332d4e4fc6ccb6d2ebb whisper-cpu-macos-arm64.zip \
            0f436373ca3f2de9c35dbe0b1b84fd2bdef1aa01ab165eff38bd7254f194c636 ffmpeg-macos-arm64.zip \
            a38bcb31dcd68cf7d9a630e2148ccf0656f95ac87c5bcbc4064a689f383b2059 ggml-tiny.bin \
            abd79739d3ff4bc37fa1d24f1fca8244f2e31ec9f0bb7ea6244b185bfaa0b8e6 ggml-silero-vad.bin \
            59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e jfk.wav \
            6547892b3469d27d789bd440d8d8c2971fbe6b2625a7a320307f46bae2cde448 mostly-silence-10min.m4a \
            > dl/expected.txt
          (cd dl && shasum -a 256 -c expected.txt)
          for name in whisper-cpu ffmpeg; do
            mkdir -p "work/$name"
            unzip -q "dl/$name-macos-arm64.zip" -d "work/$name"
          done
          published=$(find "$PWD/work/whisper-cpu" -type f -name whisper-cli | head -1)
          ffmpeg=$(find "$PWD/work/ffmpeg" -type f -name ffmpeg | head -1)
          chmod +x "$published" "$ffmpeg"
          echo "PUBLISHED=$published" >> "$GITHUB_ENV"
          "$ffmpeg" -hide_banner -loglevel error -i dl/mostly-silence-10min.m4a -ar 16000 -ac 1 -c:a pcm_s16le work/silence.wav
          # run.sh LABEL LIMIT_SECONDS COMMAND...: one timed run with JSON output, never failing the step.
          cat > run.sh <<'SCRIPT'
          #!/bin/bash
          label=$1; limit=$2; shift 2
          start=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
          perl -e 'alarm shift; exec @ARGV or die "exec failed: $!\n"' "$limit" "$@" -oj -of "work/$label" > "out-$label.txt" 2>&1
          code=$?
          end=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
          printf '%-26s exit %3s  %8s s\n' "$label" "$code" "$(perl -e "printf '%.1f', $end - $start")" | tee -a summary.txt
          SCRIPT
          chmod +x run.sh

      - name: Eleven seconds of speech, 3 threads
        run: |
          ./run.sh published-jfk-t3 240 "$PUBLISHED" -m dl/ggml-tiny.bin -f dl/jfk.wav -l en -t 3 -ng
          ./run.sh patched-jfk-t3 240 "$PATCHED" -m dl/ggml-tiny.bin -f dl/jfk.wav -l en -t 3 -ng

      - name: Speech detection over 10 minutes of mostly silence, patched engine
        run: |
          for threads in 3 2 1; do
            ./run.sh "patched-vad-t$threads" 480 "$PATCHED" -m dl/ggml-tiny.bin -f work/silence.wav -l en \
              -t "$threads" -ng --vad -vm dl/ggml-silero-vad.bin
          done

      - name: Same, published engine and patched engine at 4 threads, for comparison
        run: |
          ./run.sh published-vad-t3 300 "$PUBLISHED" -m dl/ggml-tiny.bin -f work/silence.wav -l en -t 3 -ng \
            --vad -vm dl/ggml-silero-vad.bin
          ./run.sh patched-vad-t4 180 "$PATCHED" -m dl/ggml-tiny.bin -f work/silence.wav -l en -t 4 -ng \
            --vad -vm dl/ggml-silero-vad.bin

      - name: Check the transcripts and summarize
        if: always()
        run: |
          uptime
          cat summary.txt
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          def segments(label):
              path = pathlib.Path(f"work/{label}.json")
              if not path.is_file():
                  return None
              data = json.loads(path.read_text())
              return [[s["timestamps"]["from"], s["timestamps"]["to"], s["text"]] for s in data["transcription"]]

          text = " And so my fellow Americans ask not what your country can do for you ask what you can do for your country."
          # The patched and published engines gave exactly these on an M2 Mac with 1 to 4 threads.
          expected_vad = [["00:00:00,320", "00:00:10,560", text], ["00:05:00,320", "00:05:10,520", text]]
          expected_jfk = [["00:00:00,000", "00:00:10,500",
                           " And so, my fellow Americans, ask not what your country can do for you,"
                           " ask what you can do for your country."]]
          failed = False
          for label, expected, required in [
              ("published-jfk-t3", expected_jfk, True),
              ("patched-jfk-t3", expected_jfk, True),
              ("patched-vad-t3", expected_vad, True),
              ("patched-vad-t2", expected_vad, True),
              ("patched-vad-t1", expected_vad, True),
              ("published-vad-t3", expected_vad, False),
              ("patched-vad-t4", expected_vad, False),
          ]:
              got = segments(label)
              state = "no output" if got is None else ("same as the M2 Mac" if got == expected else "DIFFERENT")
              print(f"{label:26} {state}")
              if required and got != expected:
                  failed = True
          sys.exit(1 if failed else 0)
          PY
